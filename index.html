<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPYMI UFRJ</title>
</head>
<body style="margin:0;font-family:Arial,sans-serif;background:#f2f4f8">

<div style="background:#0a1931;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<img src="logo.png" style="height:36px;background:white;border-radius:4px;padding:2px 6px" onerror="this.style.display='none'">
<button onclick="a('conceito')" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:20px;font-weight:800">Conceito</button>
<button onclick="a('identidade')" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:20px;font-weight:800">Identidade</button>
</div>

<div id="conceito" style="display:block;max-width:420px;margin:16px auto;background:white;padding:24px 16px;border-radius:16px;text-align:center">
<img src="logo.png" style="width:250px;max-width:90%;display:block;margin:0 auto 12px">
<p style="font-size:9px;letter-spacing:2px;color:#0a3a6b;font-weight:700;margin:0 0 18px">NÚCLEO DE AUTOMAÇÃO E PROJETOS • UFRJ</p>
<h1 style="font-size:26px;color:#0a3a6b;font-weight:900;line-height:1.2;margin:0 0 12px">Mergulhando em ideias,<br>emergindo soluções.</h1>
<p style="font-size:13px;color:#333;line-height:1.5">Somos o time de robótica da UFRJ dedicado ao desenvolvimento de ROVs.</p>
<div style="background:#eef2f7;border-radius:18px;padding:12px;margin-top:16px">
<img src="mascote.png" style="width:100%;max-width:300px;display:block;margin:auto" onerror="this.innerHTML='🦈'">
<div style="margin-top:10px"><span style="background:#dce6f1;color:#0a3a6b;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">ROV</span> <span style="background:#dce6f1;color:#0a3a6b;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">UFRJ</span></div>
</div>
</div>

<div id="identidade" style="display:none;max-width:420px;margin:16px auto;background:white;padding:24px 16px;border-radius:16px;text-align:center">
<h2 style="color:#0a3a6b">Identidade Visual</h2>
<div style="background:#eef2f7;border-radius:18px;padding:20px">
<img src="logo.png" style="width:260px;max-width:95%;display:block;margin:auto">
</div>
<p style="font-size:12px;color:#666;margin-top:10px">Logo oficial oval azul - sem imagem quebrada</p>
</div>

<script>
function a(id){
document.getElementById('conceito').style.display='none';
document.getElementById('identidade').style.display='none';
document.getElementById(id).style.display='block';
}
</script>

</body>
</html>
